<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download App APK</title>
    <style>
        :root {
            --md-sys-color-primary: #EE1D52;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-background: #121212;
            --md-sys-color-surface: #1e1e1e;
            --md-sys-color-on-surface: #e3e3e3;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-surface);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: var(--md-sys-color-surface);
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: 24px;
        }
        .button {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-weight: bold;
            font-size: 16px;
            display: inline-block;
            transition: background-color 0.2s;
        }
        .button:hover {
            background-color: #d01746;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Music App</h1>
        <p>Debug Build • Ready to install</p>
        <a href="app-debug.apk" class="button">Download APK</a>
    </div>
</body>
</html>
